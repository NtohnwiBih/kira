services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes: [./nginx/dev.conf:/etc/nginx/conf.d/default.conf]
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
      ai-gateway:
        condition: service_started
    restart: on-failure

  frontend:
    build: { context: ./frontend, target: dev }
    volumes: [./frontend:/app, /app/node_modules]
    environment: [NEXT_PUBLIC_API_URL=http://localhost/api]
    depends_on: [backend]

  backend:
    build: { context: ./backend, target: dev }
    volumes: [./backend:/app, /app/node_modules]
    working_dir: /app
    env_file: ./backend/.env
    depends_on: [postgres, redis]
  
  ai-gateway:
    build: { context: ./ai-gateway, target: dev }
    volumes: [./ai-gateway:/app]
    env_file: ./ai-gateway/.env
    depends_on: [redis]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kira_db
      POSTGRES_USER: kira_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kira_user -d kira_db"]
      interval: 5s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

volumes:
  postgres_data:
  redis_data: