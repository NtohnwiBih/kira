upstream backend    { server backend:4000;    keepalive 32; }
upstream ai-gateway { server ai-gateway:8000; keepalive 16; }
upstream frontend   { server frontend:3000;   keepalive 16; }


server {
  listen 80;
  server_name _;
  server_tokens off;  

  client_max_body_size 20M;

  # ── Shared proxy defaults ─────────────────────
  proxy_http_version      1.1;
  proxy_buffering         off;
  proxy_request_buffering off;

  proxy_set_header Host               $host;
  proxy_set_header X-Real-IP          $remote_addr;
  proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto  $scheme;

  # ── Backend REST API ──────────────────────────
  location /api/ {
    proxy_pass http://backend/api/; 

    proxy_connect_timeout   10s;
    proxy_send_timeout      30s;
    proxy_read_timeout      30s;
  }

  # ── Swagger UI ────────────────────────────────
  location /docs {
    proxy_pass http://backend/docs;
  }

  # ── WebSocket — real-time order tracking ──────
  location /socket.io/ {
    proxy_pass http://backend;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout  10s;
    proxy_read_timeout     3600s;  
    proxy_send_timeout     3600s;
  }

  location ~* ^/ai-gateway(/.*)?$ {
    deny all;
    return 403;
  }

  # ── Frontend (catch-all) ──────────────────────
  location / {
    proxy_pass http://frontend;

    proxy_read_timeout 3600s;  
  }
}